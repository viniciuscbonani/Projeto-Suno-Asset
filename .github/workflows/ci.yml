name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python scripts/prepare_tokenizer.py
      - run: uv run --frozen --extra dev python -c "import suno_asset"
      - run: uv run --frozen --extra dev pytest -m 'not live'
