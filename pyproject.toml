[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suno-asset"
version = "0.1.0"
description = "Pipeline acadêmico de conteúdo financeiro rastreável"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "pdfplumber>=0.11,<0.12",
    "pydantic>=2.10,<3",
    "tiktoken>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suno_asset = ["web/*.html", "web/*.css", "web/*.mjs", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: chamada opcional e paga ao Groq"]

